<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071b3a"><title>KGROW Nano 0.1 — KGROW AI</title>
<style>
:root{--navy:#071b3a;--navy2:#0c2a55;--orange:#f97316;--orange2:#fb923c;--ink:#10233e;--muted:#65758b;--line:#dbe4ef;--soft:#f5f8fc;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:280px;background:var(--navy);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em}.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:24px;font-weight:950;position:relative}.logo:after{content:"";position:absolute;width:9px;height:9px;background:var(--orange);border-radius:50%;right:4px;top:4px}.brand small{display:block;color:#9fb7d4;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}.new-chat{border:1px solid #41638d;background:#103665;color:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-weight:750;cursor:pointer}.new-chat:hover{background:#184375}.history{display:flex;flex-direction:column;gap:8px;overflow:auto}.history-label{color:#91aaca;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.history button{border:0;background:transparent;color:#c6d4e5;text-align:left;border-radius:9px;padding:9px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover{background:#143c6e;color:#fff}.side-bottom{margin-top:auto;border-top:1px solid #23466f;padding-top:16px;color:#9fb7d4;font-size:12px;line-height:1.5}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,42px);gap:12px}.model{display:flex;align-items:center;gap:10px;font-weight:800}.status{width:9px;height:9px;border-radius:50%;background:#21b77b;box-shadow:0 0 0 4px #dff7ed}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:9px 11px;cursor:pointer}.content{width:min(880px,100%);margin:0 auto;display:flex;flex-direction:column;flex:1;padding:clamp(24px,6vh,70px) 16px 18px}.welcome{text-align:center;margin:auto 0 26px}.welcome .mark{margin:0 auto 14px;width:58px;height:58px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:950;box-shadow:0 10px 28px #09214822}.welcome h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px;letter-spacing:-.04em}.welcome p{color:var(--muted);margin:0;font-size:15px}.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:690px;margin:22px auto 0}.suggestions button{background:#fff;border:1px solid var(--line);color:#31445d;padding:12px;border-radius:12px;text-align:left;font-size:13px;cursor:pointer}.suggestions button:hover{border-color:#9fb9d7;box-shadow:0 5px 15px #132b4c0b}.messages{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}.message{display:flex;gap:11px;align-items:flex-start}.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px}.message.user .avatar{background:#e7eef8;color:#2c4c72}.message.assistant .avatar{background:var(--navy);color:#fff}.bubble{max-width:80%;background:#fff;border:1px solid var(--line);border-radius:4px 15px 15px 15px;padding:12px 14px;line-height:1.55;font-size:14px;white-space:pre-wrap}.message.user{flex-direction:row-reverse}.message.user .bubble{background:#eaf2fc;border-color:#c8daee;border-radius:15px 4px 15px 15px}.composer-wrap{margin-top:auto}.composer{background:#fff;border:1px solid #b9cbe0;border-radius:17px;padding:10px;box-shadow:0 8px 28px #15365c12;display:flex;align-items:flex-end;gap:8px}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:44px;max-height:140px;padding:10px 7px;color:var(--ink);background:transparent}.composer textarea::placeholder{color:#93a1b2}.send{border:0;background:var(--orange);color:#fff;border-radius:11px;width:44px;height:44px;cursor:pointer;font-size:18px;font-weight:900}.send:hover{background:#ea580c}.composer-note{text-align:center;color:#8a98a9;font-size:11px;margin:9px 0 0}.mobile-menu{display:none}@media(max-width:700px){.sidebar{display:none}.mobile-menu{display:block}.topbar{height:64px}.content{padding:28px 14px 14px}.welcome{margin-top:18px}.suggestions{grid-template-columns:1fr;gap:8px}.suggestions button{padding:11px}.bubble{max-width:84%}.top-actions .icon-btn:first-child{display:none}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">K</div><div>KGROW AI<small>KGROW Nano 0.1</small></div></div><button class="new-chat" id="newChat">+&nbsp; New chat</button><div class="history"><div class="history-label">Recent chats</div><button class="active">Welcome to KGROW Nano</button><button>Product research ideas</button><button>Understanding AI</button></div><div class="side-bottom">Cloud mode is active<br>Conversations are private to your account.</div></aside><main class="main"><header class="topbar"><div class="model"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><span class="status"></span><span>KGROW Nano 0.1</span></div><div class="top-actions"><button class="icon-btn" id="aboutBtn">About model</button><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button></div></header><section class="content"><div id="welcome" class="welcome"><div class="mark">K</div><h1>How can I help you today?</h1><p>Ask in Hindi, Hinglish, or English.</p><div class="suggestions"><button data-prompt="Hye kese ho?">Start a conversation</button><button data-prompt="Mujhe laptop lena hai, budget 60000 hai.">Get a recommendation</button><button data-prompt="What is artificial intelligence?">Learn something new</button></div></div><div class="messages" id="messages"></div><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" placeholder="Message KGROW Nano..." aria-label="Message KGROW Nano"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form><div class="composer-note">KGROW Nano can make mistakes. Check important information.</div></div></section></main></div><script>
const messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),prompt=document.querySelector('#prompt'),form=document.querySelector('#chatForm');let transcript=[];
function addMessage(role,text){const row=document.createElement('div');row.className='message '+role;row.innerHTML='<div class="avatar">'+(role==='user'?'You':'K')+'</div><div class="bubble"></div>';row.querySelector('.bubble').textContent=text;messages.append(row);return row.querySelector('.bubble')}
async function send(text){text=text.trim();if(!text)return;welcome.style.display='none';addMessage('user',text);prompt.value='';prompt.style.height='auto';const bubble=addMessage('assistant','');bubble.textContent='Thinking...';transcript.push({role:'user',content:text});try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:transcript})});if(!r.ok)throw new Error((await r.json()).error||'Unable to connect');const reader=r.body.getReader(),decoder=new TextDecoder();let answer='';bubble.textContent='';while(true){const {value,done}=await reader.read();if(done)break;answer+=decoder.decode(value,{stream:true});bubble.textContent=answer;window.scrollTo(0,document.body.scrollHeight)}transcript.push({role:'assistant',content:answer})}catch(e){bubble.textContent='I could not reach Cloud Mode right now. Please try again in a moment.';transcript.pop()}}
form.addEventListener('submit',e=>{e.preventDefault();send(prompt.value)});prompt.addEventListener('input',()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,140)+'px'});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent?.isComposing&&e.keyCode!==229){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));document.querySelector('#newChat').onclick=()=>{transcript=[];messages.innerHTML='';welcome.style.display='block';prompt.focus()};document.querySelector('#aboutBtn').onclick=()=>alert('KGROW Nano 0.1 uses a secured cloud AI provider in Cloud Mode. KGROW does not claim to have independently trained the underlying model.');document.querySelector('#themeBtn').onclick=()=>document.body.classList.toggle('dim');document.querySelector('#menuBtn').onclick=()=>alert('Open KGROW AI on a wider screen to view chat history.');
</script></body></html>
